<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.css">
	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="container-fluid p-0 border-bottom border-black border-3">
	<div class="row">
		<div class="col">
			<a href="{{ '/' | relative_url }}"><img src="{{ 'assets/schütz.jpg' | relative_url }}" alt="An image of Heinrich Schütz" class="h-100 float-start"></a>
			<h1 class="display-1">{{ site.title }}</h1>
			<nav class="nav bg-light">
				{%- assign nav_pages = site.html_pages | where_exp: "item", "item.title != 'Home'" %}
				{%- for p in nav_pages %}
					<a href="{{ p.url | relative_url }}" class="nav-link">{{ p.title }}</a>
				{%- endfor %}
			</nav>
		</div>
	</div>
	
	{% if page.title != "Home" %}
		<h1>{{ page.title }}</h1>
	{% endif %}
</header>

<main class="container pt-3">
	{{ content }}
</main>

<script src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.js"></script>

</body>

</html>
